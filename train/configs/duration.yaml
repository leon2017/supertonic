data:
  train_dir: ./data/zh/train
  val_dir: ./data/zh/val
  unicode_indexer: ./assets/onnx/unicode_indexer_zh.json
  n_mels: 228

model:
  vocab_size: 10000
  mel_channels: 228
  text_channels: 256
  style_channels: 256
  hidden_dim: 256

training:
  iterations: 100000
  batch_size: 8
  gradient_accumulation: 8
  learning_rate: 0.0001
  weight_decay: 0.01
  fp16: true

checkpoint:
  save_dir: ./checkpoints/duration
  save_interval: 10000
  latest_interval: 1000
  keep_last_n: 5

logging:
  log_interval: 100
  val_interval: 5000
